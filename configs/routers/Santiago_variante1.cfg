! =============================================================================
! Router Casa Matriz - Santiago (Cisco c2691)
! Proyecto TechnoMarket Ltda. - Equipo 1 (DHCP Centralizado entre Sedes)
! =============================================================================
! CONEXIONADO EN GNS3:
! - Fa0/0 <-> Router Sucursal (Vina/Valparaiso) Fa0/0   [Enlace WAN: 10.10.10.0/30]
! - Fa0/1 <-> FirewallSantiago (pfSense) e0             [Tránsito Matriz/DMZ: 192.168.0.40/30]
! =============================================================================

version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Santiago
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- Enlace WAN hacia Sucursal Valparaiso ---
interface FastEthernet0/0
 description ENLACE_WAN_A_VALPARAISO
 ip address 10.10.10.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! --- Enlace L3 hacia FirewallSantiago (Casa Matriz + DMZ donde vive DNSDHCP 192.168.0.34) ---
interface FastEthernet0/1
 description TRANSITO_FIREWALL_SANTIAGO
 ip address 192.168.0.41 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! =============================================================================
! ENRUTAMIENTO HACIA CASA MATRIZ Y DMZ (detrás de FirewallSantiago 192.168.0.42)
! =============================================================================
! VLAN 10 - Administracion y Finanzas (8 empleados -> /28)
ip route 192.168.0.0 255.255.255.240 192.168.0.42
! VLAN 20 - Gerencia General (3 empleados -> /29)
ip route 192.168.0.16 255.255.255.248 192.168.0.42
! VLAN 30 - TI y Comunicaciones (4 empleados -> /29)
ip route 192.168.0.24 255.255.255.248 192.168.0.42
! DMZ - Servidores Corporativos: DNSDHCP (.34), ACDC (.35), HTTPS (.36)
ip route 192.168.0.32 255.255.255.248 192.168.0.42
!
! =============================================================================
! ENRUTAMIENTO HACIA VLANs DE SUCURSAL VALPARAISO (retorno de paquetes DHCP/HTTP/DNS)
! =============================================================================
! Ámbito Remoto 1: VLAN 10 Ventas (10.0.0.0/28)
ip route 10.0.0.0 255.255.255.240 10.10.10.2
! Ámbito Remoto 2: VLAN 20 Soporte Tecnico (10.0.0.16/28)
ip route 10.0.0.16 255.255.255.240 10.10.10.2
! Ámbito Remoto 3: VLAN 30 Bodega y Logistica (10.0.0.32/28)
ip route 10.0.0.32 255.255.255.240 10.10.10.2
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
