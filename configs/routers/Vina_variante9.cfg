! =============================================================================
! Router Sucursal - Valparaiso / Vina (Cisco c2691 + NM-16ESW)
! Proyecto TechnoMarket Ltda. - Equipo 9 (Redundancia de Enrutamiento)
! =============================================================================
! PASO PREVIO EN MODO PRIVILEGIADO (crear VLANs en el modulo NM-16ESW):
!   Valparaiso# vlan database
!   Valparaiso(vlan)# vlan 10 name VENTAS
!   Valparaiso(vlan)# vlan 20 name SOPORTE
!   Valparaiso(vlan)# vlan 30 name BODEGA
!   Valparaiso(vlan)# vlan 99 name NATIVA
!   Valparaiso(vlan)# exit
! =============================================================================

version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Valparaiso
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- Enlace WAN Principal hacia Casa Matriz Santiago ---
interface FastEthernet0/0
 description WAN_PRINCIPAL_A_SANTIAGO
 ip address 10.10.10.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! --- Enlace WAN de Respaldo hacia Casa Matriz Santiago (Variante 9) ---
interface FastEthernet0/1
 description WAN_RESPALDO_A_SANTIAGO
 ip address 10.10.10.6 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! --- Troncal 802.1Q hacia SwitchAccesoV (e0) ---
interface FastEthernet1/0
 description TRUNK_SWITCH_ACCESO_SUCURSAL
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
 no shutdown
!
! =============================================================================
! INTERFACES SVI INTER-VLAN + DHCP RELAY (Servidor DNSDHCP: 192.168.0.34)
! =============================================================================
! VLAN 10 - Ventas (12 empleados -> 10.0.0.0/28)
interface Vlan10
 description LAN_VENTAS
 ip address 10.0.0.1 255.255.255.240
 ip helper-address 192.168.0.34
 no shutdown
!
! VLAN 20 - Soporte Tecnico (10 empleados -> 10.0.0.16/28)
interface Vlan20
 description LAN_SOPORTE_TECNICO
 ip address 10.0.0.17 255.255.255.240
 ip helper-address 192.168.0.34
 ip access-group ACL_SOPORTE_IN in
 no shutdown
!
! VLAN 30 - Bodega y Logistica (6 empleados -> 10.0.0.32/28)
interface Vlan30
 description LAN_BODEGA_LOGISTICA
 ip address 10.0.0.33 255.255.255.240
 ip helper-address 192.168.0.34
 ip access-group ACL_BODEGA_IN in
 no shutdown
!
! =============================================================================
! CONTROL DE ACCESO (Requerimiento 6: minimo 2 restricciones funcionales ACL)
! =============================================================================
! Restriccion 1: Soporte Tecnico NO puede enviar trafico directo a Ventas ni a
! Administracion/Finanzas (evita congestion por transferencia de archivos grandes),
! pero SI puede usar DNS/DHCP (192.168.0.34), portal HTTP (192.168.0.36) y el resto.
ip access-list extended ACL_SOPORTE_IN
 remark Permitir respuestas/consultas DHCP y DNS hacia DMZ
 permit udp 10.0.0.16 0.0.0.15 any eq bootps
 permit udp 10.0.0.16 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.34 eq domain
 remark Permitir acceso al portal corporativo HTTP/HTTPS
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.36 eq www
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.36 eq 443
 remark Bloquear trafico hacia Ventas y hacia Administracion/Finanzas
 deny   ip 10.0.0.16 0.0.0.15 10.0.0.0 0.0.0.15 log
 deny   ip 10.0.0.16 0.0.0.15 192.168.0.0 0.0.0.15 log
 remark Permitir resto de trafico corporativo autorizado
 permit ip 10.0.0.16 0.0.0.15 any
!
! Restriccion 2: Bodega y Logistica NO puede acceder a Gerencia General
! ni al servidor de directorio ACDC (192.168.0.35), pero SI al portal HTTP y DNS.
ip access-list extended ACL_BODEGA_IN
 permit udp 10.0.0.32 0.0.0.15 any eq bootps
 permit udp 10.0.0.32 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.36 eq www
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.36 eq 443
 deny   ip 10.0.0.32 0.0.0.15 192.168.0.16 0.0.0.7 log
 deny   ip 10.0.0.32 0.0.0.15 host 192.168.0.35 log
 permit ip 10.0.0.32 0.0.0.15 any
!
! =============================================================================
! VARIANTE 9: REDUNDANCIA DE ENRUTAMIENTO HACIA CASA MATRIZ SANTIAGO
! Ruta Principal: via 10.10.10.1 (AD = 1)
! Ruta Respaldo:  via 10.10.10.5 (AD = 10, flotante)
! =============================================================================
ip route 0.0.0.0 0.0.0.0 10.10.10.1
ip route 0.0.0.0 0.0.0.0 10.10.10.5 10
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
