! =============================================================================
! Router Sucursal - Valparaiso / Vina (Cisco c2691 + NM-16ESW)
! Proyecto TechnoMarket Ltda. - Equipo 1 (DHCP Centralizado entre Sedes)
! =============================================================================
! NOTA: Las VLANs 10, 20, 30 y 99 se crean en el módulo NM-16ESW (automático con gns3_control.py):
!   Valparaiso# vlan database
!   Valparaiso(vlan)# vlan 10 name VENTAS
!   Valparaiso(vlan)# vlan 20 name SOPORTE
!   Valparaiso(vlan)# vlan 30 name BODEGA
!   Valparaiso(vlan)# vlan 99 name NATIVA
!   Valparaiso(vlan)# exit
! =============================================================================

version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Valparaiso
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! Asegura que el router reenvíe paquetes DHCP Relay (BOOTP/UDP 67-68)
service dhcp
ip forward-protocol udp bootps
!
! --- Enlace WAN hacia Casa Matriz Santiago ---
interface FastEthernet0/0
 description ENLACE_WAN_A_SANTIAGO
 ip address 10.10.10.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
!
! --- Troncal 802.1Q hacia SwitchAccesoV (e0) ---
interface FastEthernet1/0
 description TRUNK_SWITCH_ACCESO_SUCURSAL
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
 no shutdown
!
! =============================================================================
! VARIANTE 1: INTERFACES INTER-VLAN + DHCP RELAY HACIA CASA MATRIZ (192.168.0.34)
! =============================================================================
! Ámbito Remoto 1: VLAN 10 - Ventas (12 empleados -> 10.0.0.0/28)
interface Vlan10
 description LAN_VENTAS_RELAY_AMBITO_1
 ip address 10.0.0.1 255.255.255.240
 ip helper-address 192.168.0.34
 no shutdown
!
! Ámbito Remoto 2: VLAN 20 - Soporte Tecnico (10 empleados -> 10.0.0.16/28)
interface Vlan20
 description LAN_SOPORTE_RELAY_AMBITO_2
 ip address 10.0.0.17 255.255.255.240
 ip helper-address 192.168.0.34
 ip access-group ACL_SOPORTE_IN in
 no shutdown
!
! Ámbito Remoto 3: VLAN 30 - Bodega y Logistica (6 empleados -> 10.0.0.32/28)
interface Vlan30
 description LAN_BODEGA_RELAY_AMBITO_3
 ip address 10.0.0.33 255.255.255.240
 ip helper-address 192.168.0.34
 ip access-group ACL_BODEGA_IN in
 no shutdown
!
! =============================================================================
! CONTROL DE ACCESO (Requerimiento 6: mínimo 2 restricciones funcionales ACL)
!IMPORTANTE: Permitir explícitamente tráfico DHCP (UDP bootpc/bootps) en las VLANs filtradas
! =============================================================================
! Restricción 1: Soporte Técnico NO puede enviar tráfico directo a Ventas ni a
! Administración/Finanzas (mitiga congestión por archivos pesados), pero SÍ usa DHCP, DNS y HTTP.
ip access-list extended ACL_SOPORTE_IN
 remark Permitir descubrimiento y renovación DHCP (Broadcast + Unicast al Relay)
 permit udp any eq bootpc any eq bootps
 remark Permitir consultas DNS hacia servidor centralizado en DMZ
 permit udp 10.0.0.16 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.34 eq domain
 remark Permitir acceso al portal corporativo HTTP/HTTPS
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.36 eq www
 permit tcp 10.0.0.16 0.0.0.15 host 192.168.0.36 eq 443
 remark Bloquear tráfico hacia Ventas y hacia Administración/Finanzas
 deny   ip 10.0.0.16 0.0.0.15 10.0.0.0 0.0.0.15 log
 deny   ip 10.0.0.16 0.0.0.15 192.168.0.0 0.0.0.15 log
 remark Permitir resto de tráfico autorizado
 permit ip 10.0.0.16 0.0.0.15 any
!
! Restricción 2: Bodega y Logística NO puede acceder a Gerencia General
! ni al servidor ACDC (192.168.0.35), pero SÍ usa DHCP, DNS y portal HTTP.
ip access-list extended ACL_BODEGA_IN
 permit udp any eq bootpc any eq bootps
 permit udp 10.0.0.32 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.34 eq domain
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.36 eq www
 permit tcp 10.0.0.32 0.0.0.15 host 192.168.0.36 eq 443
 deny   ip 10.0.0.32 0.0.0.15 192.168.0.16 0.0.0.7 log
 deny   ip 10.0.0.32 0.0.0.15 host 192.168.0.35 log
 permit ip 10.0.0.32 0.0.0.15 any
!
! --- Ruta hacia Casa Matriz y DMZ ---
ip route 0.0.0.0 0.0.0.0 10.10.10.1
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
