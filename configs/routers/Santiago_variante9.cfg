! =============================================================================
! Router Casa Matriz - Santiago (Cisco c2691)
! Proyecto TechnoMarket Ltda. - Equipo 9 (Redundancia de Enrutamiento)
! =============================================================================
! NOTA DE CONEXIONADO EN GNS3:
! - Fa0/0  <-> Router Sucursal (Vina/Valparaiso) Fa0/0   [WAN Principal: 10.10.10.0/30]
! - Fa0/1  <-> FirewallSantiago (pfSense) e0             [Transito Matriz: 192.168.0.40/30]
! - Fa1/0  <-> Router Sucursal (Vina/Valparaiso) Fa0/1   [WAN Respaldo:  10.10.10.4/30 via SVI Vlan90]
!   (Nota: En c2691 con NM-16ESW, primero crear la VLAN 90 en modo privilegiado:
!    Santiago# vlan database
!    Santiago(vlan)# vlan 90 name WAN_BACKUP
!    Santiago(vlan)# exit)
! =============================================================================

version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Santiago
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- Enlace WAN Principal hacia Sucursal Valparaiso ---
interface FastEthernet0/0
 description WAN_PRINCIPAL_A_VALPARAISO
 ip address 10.10.10.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! --- Enlace L3 hacia Firewall pfSense (Casa Matriz + DMZ) ---
interface FastEthernet0/1
 description TRANSITO_FIREWALL_SANTIAGO
 ip address 192.168.0.41 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! --- Puerto fisico para Enlace WAN de Respaldo (NM-16ESW) ---
interface FastEthernet1/0
 description PUERTO_FISICO_WAN_RESPALDO
 switchport mode access
 switchport access vlan 90
 spanning-tree portfast
 no shutdown
!
! --- Interfaz Capa 3 para Enlace WAN de Respaldo ---
interface Vlan90
 description WAN_RESPALDO_A_VALPARAISO
 ip address 10.10.10.5 255.255.255.252
 no shutdown
!
! =============================================================================
! ENRUTAMIENTO HACIA CASA MATRIZ Y DMZ (detras de FirewallSantiago)
! =============================================================================
! VLAN 10 - Administracion y Finanzas (8 empleados -> /28)
ip route 192.168.0.0 255.255.255.240 192.168.0.42
! VLAN 20 - Gerencia General (3 empleados -> /29)
ip route 192.168.0.16 255.255.255.248 192.168.0.42
! VLAN 30 - TI y Comunicaciones (4 empleados -> /29)
ip route 192.168.0.24 255.255.255.248 192.168.0.42
! DMZ - Servidores Corporativos DNSDHCP, ACDC, HTTPS (/29)
ip route 192.168.0.32 255.255.255.248 192.168.0.42
!
! =============================================================================
! VARIANTE 9: REDUNDANCIA DE ENRUTAMIENTO HACIA SUCURSAL VALPARAISO
! Camino Principal: via 10.10.10.2 (Distancia Administrativa = 1, por defecto)
! Camino Respaldo:  via 10.10.10.6 (Distancia Administrativa = 10, ruta flotante)
! =============================================================================
! --- Rutas Principales (AD = 1) ---
ip route 10.0.0.0 255.255.255.240 10.10.10.2
ip route 10.0.0.16 255.255.255.240 10.10.10.2
ip route 10.0.0.32 255.255.255.240 10.10.10.2
!
! --- Rutas Flotantes de Respaldo (AD = 10) ---
ip route 10.0.0.0 255.255.255.240 10.10.10.6 10
ip route 10.0.0.16 255.255.255.240 10.10.10.6 10
ip route 10.0.0.32 255.255.255.240 10.10.10.6 10
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
